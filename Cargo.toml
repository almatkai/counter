[package]
name = "tezbar-counter"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Standalone Rust Counter process extension for Tezbar"
repository = "https://github.com/almatkai/counter"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

[[bin]]
name = "tezbar-counter"
path = "native/main.rs"

[[test]]
name = "process"
path = "tests/process.rs"

[dependencies]
# The mature Native V2 engine is reused unchanged through a path dependency on this repository's own crate.
tezbar-counter-v2 = { path = "v2" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "fs"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "aaec571673ab64a85a136cf6bd054ef660c4d93c" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }
jsonschema = { version = "=0.29.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
